<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nornir Build Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header class="topbar">
        <h1>Nornir Build Dashboard</h1>
        <span id="connection" class="conn conn-down">disconnected</span>
    </header>

    <main class="layout">
        <aside class="runlist">
            <div class="runlist-head">
                <input id="runfilter" type="search" placeholder="Filter runs..." />
            </div>
            <ul id="runs"></ul>
        </aside>

        <section class="detail">
            <div id="detail-empty" class="detail-empty">
                Select a run to see live progress.
            </div>

            <div id="detail" class="detail-body hidden">
                <div class="detail-head">
                    <div class="detail-title">
                        <span id="d-pipeline" class="pipeline">-</span>
                        <span id="d-status" class="badge">-</span>
                    </div>
                    <div class="detail-meta">
                        <div><label>Runtime</label><span id="d-runtime">-</span></div>
                        <div><label>Run</label><span id="d-runid">-</span></div>
                        <div><label>Volume</label><span id="d-volume">-</span></div>
                        <div><label>Compute</label><span id="d-compute">-</span></div>
                        <div><label>Host</label><span id="d-host">-</span></div>
                        <div><label>Errors</label><button type="button" id="d-errors" class="count err count-filter" title="Show only error log messages">0</button></div>
                        <div><label>Warnings</label><button type="button" id="d-warnings" class="count warn count-filter" title="Show only warning log messages">0</button></div>
                    </div>
                </div>

                <div class="status-cards">
                    <div class="card">
                        <label>Current stage / command</label>
                        <span id="d-stage">-</span>
                    </div>
                    <div class="card">
                        <label>Current section / element</label>
                        <span id="d-section">-</span>
                    </div>
                </div>

                <div id="d-progress-tracks" class="progress-tracks"></div>

                <div id="d-pools-section" class="pools-section">
                    <div class="pools-head">
                        <span class="pools-title">Pools</span>
                        <label class="pools-toggle"><input type="checkbox" id="show-pools" checked /> show</label>
                    </div>
                    <div id="d-pool-tracks" class="pool-tracks"></div>
                </div>

                <div class="log-controls">
                    <label><input type="checkbox" class="lvl" value="error" checked /> errors</label>
                    <label><input type="checkbox" class="lvl" value="warning" checked /> warnings</label>
                    <label><input type="checkbox" class="lvl" value="info" checked /> info</label>
                    <label><input type="checkbox" class="lvl" value="debug" /> debug</label>
                    <label><input type="checkbox" class="lvl" value="event" checked /> events</label>
                    <label><input type="checkbox" class="lvl" value="status" checked /> status</label>
                    <input id="logsearch" type="search" placeholder="Search all retained logs..." />
                    <button id="load-older" type="button" class="log-action-btn" title="Fetch older retained events">Load older</button>
                    <button id="download-logs" type="button" class="log-action-btn" title="Download retained transcript for the current level filters and search">Download logs</button>
                </div>

                <div class="log-wrap">
                    <div id="log" class="log"></div>
                    <button id="jump-newest" type="button" class="jump-btn jump-newest hidden"
                            title="Jump to newest entry and resume auto-scroll">Jump to newest</button>
                    <button id="jump-oldest" type="button" class="jump-btn jump-oldest hidden"
                            title="Reverse to oldest-first order">Jump to oldest</button>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/app.js?v=named-tracks-1"></script>
</body>
</html>
